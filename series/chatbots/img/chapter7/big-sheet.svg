<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Arial, sans-serif"><rect width="900" height="420" fill="#ffffff"/><text x="450" y="40" font-size="32" font-weight="700" fill="#2b2730" text-anchor="middle">Every question carries the whole sheet</text><text x="30" y="110" font-size="29" font-weight="700" fill="#4a4450" text-anchor="start">4 shop files</text><text x="870" y="110" font-size="25" font-weight="600" fill="#4a4450" text-anchor="end">shop sheet 329 tokens</text><rect x="30" y="128" width="16" height="50" rx="8" fill="#4a4450"/><text x="62" y="164" font-size="30" font-weight="700" fill="#2b2730" text-anchor="start">645 tokens in</text><text x="30" y="260" font-size="29" font-weight="700" fill="#a8441f" text-anchor="start">+ 500 phones</text><text x="870" y="260" font-size="25" font-weight="600" fill="#4a4450" text-anchor="end">shop sheet 42,285 tokens</text><rect x="30" y="278" width="560" height="50" rx="8" fill="#a8441f"/><text x="606" y="314" font-size="30" font-weight="700" fill="#2b2730" text-anchor="start">42,601 tokens in</text><text x="450" y="400" font-size="27" font-weight="600" fill="#2b2730" text-anchor="middle">for one question about one phone</text></svg>