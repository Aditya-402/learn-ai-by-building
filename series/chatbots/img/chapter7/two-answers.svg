<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Arial, sans-serif"><rect width="900" height="400" fill="#ffffff"/><text x="450" y="40" font-size="34" font-weight="700" fill="#2b2730" text-anchor="middle">Two fair answers</text><rect x="30" y="70" width="840" height="110" rx="14" fill="#ffffff" stroke="#4a4450" stroke-width="4"/><text x="52" y="112" font-size="28" font-weight="700" fill="#4a4450" text-anchor="start">single prices</text><text x="52" y="156" font-size="32" font-weight="700" fill="#2b2730" text-anchor="start" font-family="Consolas, monospace">899 + 299 + 299 = 1,497</text><rect x="30" y="200" width="840" height="110" rx="14" fill="#ffffff" stroke="#a8441f" stroke-width="4"/><text x="52" y="242" font-size="28" font-weight="700" fill="#a8441f" text-anchor="start">this week's offer</text><text x="52" y="286" font-size="32" font-weight="700" fill="#2b2730" text-anchor="start" font-family="Consolas, monospace">999 + 299 = 1,298</text><text x="450" y="368" font-size="27" font-weight="600" fill="#2b2730" text-anchor="middle">in one sentence, which number should our code take?</text></svg>