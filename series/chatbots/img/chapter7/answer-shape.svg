<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Arial, sans-serif"><rect width="900" height="440" fill="#ffffff"/><text x="450" y="40" font-size="34" font-weight="700" fill="#2b2730" text-anchor="middle">One answer, two parts</text><rect x="30" y="66" width="840" height="92" rx="14" fill="#ffffff" stroke="#5a3d5c" stroke-width="4"/><text x="52" y="104" font-size="30" font-weight="700" fill="#5a3d5c" text-anchor="start">reply</text><text x="52" y="140" font-size="26" font-weight="600" fill="#4a4450" text-anchor="start">the sentence for people</text><rect x="30" y="176" width="840" height="200" rx="14" fill="#ffffff" stroke="#a8441f" stroke-width="4"/><text x="52" y="214" font-size="30" font-weight="700" fill="#a8441f" text-anchor="start">items</text><text x="200" y="214" font-size="26" font-weight="600" fill="#4a4450" text-anchor="start">for our code</text><text x="60" y="262" font-size="25" font-weight="700" fill="#4a4450" text-anchor="start">product</text><text x="480" y="262" font-size="25" font-weight="700" fill="#4a4450" text-anchor="start">price_rupees</text><text x="700" y="262" font-size="25" font-weight="700" fill="#4a4450" text-anchor="start">quantity</text><text x="60" y="304" font-size="28" font-weight="600" fill="#2b2730" text-anchor="start">20W USB-C charger</text><text x="480" y="304" font-size="30" font-weight="700" fill="#2b2730" text-anchor="start" font-family="Consolas, monospace">899</text><text x="700" y="304" font-size="30" font-weight="700" fill="#2b2730" text-anchor="start" font-family="Consolas, monospace">1</text><text x="60" y="346" font-size="28" font-weight="600" fill="#2b2730" text-anchor="start">USB-C cable, 1 m</text><text x="480" y="346" font-size="30" font-weight="700" fill="#2b2730" text-anchor="start" font-family="Consolas, monospace">299</text><text x="700" y="346" font-size="30" font-weight="700" fill="#2b2730" text-anchor="start" font-family="Consolas, monospace">2</text><text x="450" y="420" font-size="29" font-weight="700" fill="#a8441f" text-anchor="middle">our code adds it up: 899 + 2 × 299 = 1,497</text></svg>