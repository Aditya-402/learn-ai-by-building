<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8441f"/></marker></defs><rect width="900" height="300" fill="#ffffff"/><text x="450" y="34" text-anchor="middle" font-size="28" font-weight="700" fill="#2b2730">Memory window of 3</text><rect x="15" y="70" width="128" height="56" rx="10" fill="#ffffff" stroke="#9e96a6" stroke-width="2.5"/><text x="79" y="104" text-anchor="middle" font-size="20" fill="#4a4450">1 my name</text><rect x="155" y="70" width="128" height="56" rx="10" fill="#ffffff" stroke="#9e96a6" stroke-width="2.5"/><text x="219" y="104" text-anchor="middle" font-size="20" fill="#4a4450">2 shop name</text><rect x="295" y="70" width="128" height="56" rx="10" fill="#e6dcea" stroke="#5a3d5c" stroke-width="2.5"/><text x="359" y="104" text-anchor="middle" font-size="20" fill="#2b2730">3 shorter</text><rect x="435" y="70" width="128" height="56" rx="10" fill="#e6dcea" stroke="#5a3d5c" stroke-width="2.5"/><text x="499" y="104" text-anchor="middle" font-size="20" fill="#2b2730">4 RAM</text><rect x="575" y="70" width="128" height="56" rx="10" fill="#e6dcea" stroke="#5a3d5c" stroke-width="2.5"/><text x="639" y="104" text-anchor="middle" font-size="20" fill="#2b2730">5 poem</text><rect x="287" y="56" width="424" height="84" rx="14" fill="none" stroke="#5a3d5c" stroke-width="3"/><text x="499" y="166" text-anchor="middle" font-size="20" fill="#5a3d5c">short-term: sent word for word</text><rect x="733" y="70" width="152" height="56" rx="10" fill="#ffffff" stroke="#2b2730" stroke-width="2.5" stroke-dasharray="7 5"/><text x="809" y="104" text-anchor="middle" font-size="20" fill="#2b2730">6 my name?</text><text x="809" y="150" text-anchor="middle" font-size="18" fill="#4a4450">new question</text><path d="M 79 130 L 79 200" stroke="#a8441f" stroke-width="3" marker-end="url(#ar)"/><path d="M 219 130 L 219 200" stroke="#a8441f" stroke-width="3" marker-end="url(#ar)"/><rect x="20" y="206" width="380" height="74" rx="14" fill="#ffffff" stroke="#a8441f" stroke-width="3"/><text x="210" y="238" text-anchor="middle" font-size="20" fill="#a8441f">long-term: one short summary</text><text x="210" y="266" text-anchor="middle" font-size="18" fill="#4a4450">"Adi asked for a shop name..."</text><text x="662" y="236" text-anchor="middle" font-size="20" fill="#2b2730">each call sends:</text><text x="662" y="266" text-anchor="middle" font-size="20" fill="#2b2730">summary + last 3 + new question</text></svg>