<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Segoe UI, Arial, sans-serif"><rect width="900" height="540" fill="#ffffff"/><text x="450" y="40" text-anchor="middle" font-size="34" font-weight="700" fill="#2b2730">What one call sends</text><rect x="40" y="66" width="600" height="100" rx="14" fill="#ffffff" stroke="#a8441f" stroke-width="4"/><text x="64" y="110" font-size="32" font-weight="700" fill="#a8441f">1  system prompt</text><text x="64" y="146" font-size="26" font-weight="600" fill="#4a4450">who the bot is, every call</text><rect x="40" y="182" width="600" height="100" rx="14" fill="#e6dcea" stroke="#5a3d5c" stroke-width="4"/><text x="64" y="226" font-size="32" font-weight="700" fill="#5a3d5c">2  summary</text><text x="64" y="262" font-size="26" font-weight="600" fill="#4a4450">the older chat, short</text><rect x="40" y="298" width="600" height="100" rx="14" fill="#e6dcea" stroke="#5a3d5c" stroke-width="4"/><text x="64" y="342" font-size="32" font-weight="700" fill="#5a3d5c">3  last exchanges</text><text x="64" y="378" font-size="26" font-weight="600" fill="#4a4450">word for word</text><rect x="40" y="414" width="600" height="100" rx="14" fill="#ffffff" stroke="#2b2730" stroke-width="4" stroke-dasharray="9 6"/><text x="64" y="458" font-size="32" font-weight="700" fill="#2b2730">4  new question</text><text x="64" y="494" font-size="26" font-weight="600" fill="#4a4450">what you just asked</text><path d="M 680 116 L 680 116" /><text x="770" y="124" text-anchor="middle" font-size="26" font-weight="700" fill="#a8441f">system</text><text x="770" y="156" text-anchor="middle" font-size="26" font-weight="700" fill="#a8441f">instruction</text><path d="M 668 96 L 680 96 L 680 156 L 668 156" fill="none" stroke="#a8441f" stroke-width="4"/><path d="M 668 186 L 680 186 L 680 512 L 668 512" fill="none" stroke="#5a3d5c" stroke-width="4"/><text x="770" y="356" text-anchor="middle" font-size="26" font-weight="700" fill="#5a3d5c">contents</text></svg>