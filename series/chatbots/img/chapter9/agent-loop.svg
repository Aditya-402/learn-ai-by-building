<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Segoe UI, Arial, sans-serif"><rect width="900" height="450" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8441f"/></marker></defs><text x="450" y="38" font-size="32" font-weight="700" fill="#2b2730" text-anchor="middle">An agent: a model + tools + a loop</text><rect x="330" y="62" width="240" height="84" rx="14" fill="#ffffff" stroke="#5a3d5c" stroke-width="4"/><text x="450" y="98" font-size="30" font-weight="700" fill="#5a3d5c" text-anchor="middle">Plan</text><text x="450" y="130" font-size="22" font-weight="600" fill="#4a4450" text-anchor="middle">which tool next?</text><rect x="600" y="190" width="240" height="84" rx="14" fill="#ffffff" stroke="#a8441f" stroke-width="4"/><text x="720" y="226" font-size="30" font-weight="700" fill="#a8441f" text-anchor="middle">Execute</text><text x="720" y="258" font-size="22" font-weight="600" fill="#4a4450" text-anchor="middle">call one tool</text><rect x="330" y="318" width="240" height="84" rx="14" fill="#ffffff" stroke="#5a3d5c" stroke-width="4"/><text x="450" y="354" font-size="30" font-weight="700" fill="#5a3d5c" text-anchor="middle">Evaluate</text><text x="450" y="386" font-size="22" font-weight="600" fill="#4a4450" text-anchor="middle">does it answer?</text><rect x="60" y="190" width="240" height="84" rx="14" fill="#ffffff" stroke="#a8441f" stroke-width="4"/><text x="180" y="226" font-size="30" font-weight="700" fill="#a8441f" text-anchor="middle">Iterate</text><text x="180" y="258" font-size="22" font-weight="600" fill="#4a4450" text-anchor="middle">if not, plan again</text><path d="M 572 104 Q 696.0 115.0 700 186" fill="none" stroke="#a8441f" stroke-width="4" marker-end="url(#ah)"/><path d="M 700 278 Q 697.0 349.0 574 360" fill="none" stroke="#a8441f" stroke-width="4" marker-end="url(#ah)"/><path d="M 328 360 Q 204.0 349.0 200 278" fill="none" stroke="#a8441f" stroke-width="4" marker-end="url(#ah)"/><path d="M 200 186 Q 204.0 115.0 328 104" fill="none" stroke="#a8441f" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="238" font-size="22" font-weight="600" fill="#4a4450" text-anchor="middle">answer when</text><text x="450" y="264" font-size="22" font-weight="600" fill="#4a4450" text-anchor="middle">it has everything</text><text x="450" y="432" font-size="22" font-weight="600" fill="#4a4450" text-anchor="middle">a common pattern for agents, not one formal standard</text></svg>