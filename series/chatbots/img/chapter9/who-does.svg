<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Segoe UI, Arial, sans-serif"><rect width="900" height="430" fill="#ffffff"/><text x="450" y="40" font-size="34" font-weight="700" fill="#2b2730" text-anchor="middle">Who does what?</text><rect x="30" y="66" width="400" height="300" rx="14" fill="#ffffff" stroke="#5a3d5c" stroke-width="4"/><text x="230" y="108" font-size="30" font-weight="700" fill="#5a3d5c" text-anchor="middle">the prompt asks</text><text x="230" y="140" font-size="22" font-weight="600" fill="#4a4450" text-anchor="middle" font-family="Consolas, monospace">agent.txt</text><text x="60" y="196" font-size="26" font-weight="600" fill="#2b2730" text-anchor="start">● plan the next tool</text><text x="60" y="246" font-size="26" font-weight="600" fill="#2b2730" text-anchor="start">● evaluate the result</text><text x="60" y="296" font-size="26" font-weight="600" fill="#2b2730" text-anchor="start">● answer when done</text><rect x="470" y="66" width="400" height="300" rx="14" fill="#ffffff" stroke="#a8441f" stroke-width="4"/><text x="670" y="108" font-size="30" font-weight="700" fill="#a8441f" text-anchor="middle">our code does</text><text x="670" y="140" font-size="22" font-weight="600" fill="#4a4450" text-anchor="middle" font-family="Consolas, monospace">bot.py · the loop</text><text x="500" y="196" font-size="26" font-weight="600" fill="#2b2730" text-anchor="start">● runs the tool</text><text x="500" y="246" font-size="26" font-weight="600" fill="#2b2730" text-anchor="start">● sends the result back</text><text x="500" y="296" font-size="26" font-weight="600" fill="#2b2730" text-anchor="start">● stops at the step cap</text><text x="450" y="410" font-size="26" font-weight="700" fill="#a8441f" text-anchor="middle">a prompt cannot run anything: our loop does</text></svg>