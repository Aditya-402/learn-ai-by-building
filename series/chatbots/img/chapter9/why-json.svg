<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Arial, sans-serif"><rect width="900" height="440" fill="#ffffff"/><text x="450" y="40" font-size="28" font-weight="700" fill="#2b2730" text-anchor="middle">Same question, step cap 10, asked twice each</text><rect x="30" y="70" width="400" height="260" rx="14" fill="#ffffff" stroke="#a8441f" stroke-width="4"/><text x="230" y="112" font-size="27" font-weight="700" fill="#a8441f" text-anchor="middle">structured answers (JSON)</text><text x="230" y="144" font-size="27" font-weight="700" fill="#a8441f" text-anchor="middle">+ tools, together</text><text x="230" y="214" font-size="34" font-weight="700" fill="#2b2730" text-anchor="middle">10 of 10 steps</text><text x="230" y="262" font-size="25" font-weight="600" fill="#4a4450" text-anchor="middle">no answer, both times</text><rect x="470" y="70" width="400" height="260" rx="14" fill="#ffffff" stroke="#2f6b3a" stroke-width="4"/><text x="670" y="112" font-size="27" font-weight="700" fill="#2f6b3a" text-anchor="middle">plain text</text><text x="670" y="144" font-size="27" font-weight="700" fill="#2f6b3a" text-anchor="middle">+ tools</text><text x="670" y="214" font-size="34" font-weight="700" fill="#2b2730" text-anchor="middle">5 steps</text><text x="670" y="262" font-size="25" font-weight="600" fill="#4a4450" text-anchor="middle">Galaxy M06 5G, 9,999</text><text x="670" y="294" font-size="25" font-weight="600" fill="#4a4450" text-anchor="middle">both times</text><text x="450" y="380" font-size="25" font-weight="700" fill="#a8441f" text-anchor="middle">so: think in plain text, then shape the answer once, at the end</text><text x="450" y="420" font-size="19" font-weight="600" fill="#4a4450" text-anchor="middle">tested off camera, 26 Nov 2026</text></svg>