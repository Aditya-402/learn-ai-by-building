<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Arial, sans-serif"><rect width="900" height="440" fill="#ffffff"/><text x="450" y="40" font-size="34" font-weight="700" fill="#2b2730" text-anchor="middle">How a tool call works</text><rect x="30" y="66" width="840" height="70" rx="14" fill="#ffffff" stroke="#5a3d5c" stroke-width="4"/><text x="62" y="112" font-size="32" font-weight="700" fill="#5a3d5c" text-anchor="middle">1</text><text x="100" y="98" font-size="27" font-weight="700" fill="#2b2730" text-anchor="start">Gemini asks for the tool</text><text x="100" y="126" font-size="22" font-weight="600" fill="#4a4450" text-anchor="start" font-family="Consolas, monospace">find_phone("Galaxy S25")</text><rect x="30" y="150" width="840" height="70" rx="14" fill="#ffffff" stroke="#a8441f" stroke-width="4"/><text x="62" y="196" font-size="32" font-weight="700" fill="#a8441f" text-anchor="middle">2</text><text x="100" y="182" font-size="27" font-weight="700" fill="#2b2730" text-anchor="start">our code runs it</text><text x="100" y="210" font-size="22" font-weight="600" fill="#4a4450" text-anchor="start" font-family="Consolas, monospace">reads data/phones.xlsx</text><rect x="30" y="234" width="840" height="70" rx="14" fill="#ffffff" stroke="#a8441f" stroke-width="4"/><text x="62" y="280" font-size="32" font-weight="700" fill="#a8441f" text-anchor="middle">3</text><text x="100" y="266" font-size="27" font-weight="700" fill="#2b2730" text-anchor="start">the rows go back</text><text x="100" y="294" font-size="22" font-weight="600" fill="#4a4450" text-anchor="start" font-family="Consolas, monospace">model, price, stock</text><rect x="30" y="318" width="840" height="70" rx="14" fill="#ffffff" stroke="#5a3d5c" stroke-width="4"/><text x="62" y="364" font-size="32" font-weight="700" fill="#5a3d5c" text-anchor="middle">4</text><text x="100" y="350" font-size="27" font-weight="700" fill="#2b2730" text-anchor="start">Gemini answers from them</text><text x="100" y="378" font-size="22" font-weight="600" fill="#4a4450" text-anchor="start" font-family="Consolas, monospace">69,999 rupees, in stock</text><text x="450" y="420" font-size="26" font-weight="700" fill="#a8441f" text-anchor="middle">the model never runs anything: our code does</text></svg>